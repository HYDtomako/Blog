name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Test public ask
        run: npm run test:public-ask

      - name: Test related
        run: npm run test:related

      - name: Test comments
        run: npm run test:comments

      - name: Test stats
        run: npm run test:stats

      - name: Test intro
        run: npm run test:intro

      - name: Build
        # The build embeds the public Turnstile site key into /ask; without one, verify fails on a
        # page that ships no widget. Set the repository variable to your own widget's site key when
        # you have one — the fallback is Cloudflare's always-passing test key, so CI stays green
        # without secrets.
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY || '1x00000000000000000000AA' }}
        run: npm run build

      - name: Verify
        run: npm run verify

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/public-ask-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/public-ask-worker/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: MCP protocol integration
        run: npm run test:mcp-protocol

      - name: Product-client record schema
        run: npm run test:product-client-records

      - name: Bundle check
        run: npm run bundle:check
